<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Rakugaki'; src: url('../assets/fonts/rakugaki.woff') format('woff'); }
html, body { margin: 0; background: #fff; }
</style></head>
<body><div id="out"></div>
<script type="module">
// Xのアイコン・ヘッダー画像を、ゲームと同じ落書きの絵で作る（tools/brand.mjs から撮影する）
import * as Phaser from '../vendor/phaser.esm.min.js';
import { generateDoodles, drawDoodle } from '../src/fx/doodle.js';
const kind = new URLSearchParams(location.search).get('kind') || 'icon';
const size = kind === 'icon' ? [800, 800] : kind === 'og' ? [1200, 630] : [1500, 500];
const FONT = 'Rakugaki, sans-serif';
class Brand extends Phaser.Scene {
  constructor() { super('Brand'); }
  async create() {
    await document.fonts.load('80px Rakugaki');
    generateDoodles(this);
    const [w, h] = size;
    this.add.tileSprite(w / 2, h / 2, w, h, 'grid');
    // ベクターのまま拡大して描く（中心を x, y に合わせる）
    const doodle = (name, x, y, scale, frame = 0, rot = 0) => {
      const g = this.add.graphics();
      const sz = drawDoodle(g, name, frame);
      g.setScale(scale).setRotation(rot);
      const c = Math.cos(rot), sn = Math.sin(rot), half = (sz * scale) / 2;
      g.setPosition(x - (half * c - half * sn), y - (half * sn + half * c));
      return g;
    };
    const t = (x, y, s, px, color = '#2E3138') => this.add.text(x, y, s, { fontFamily: FONT, fontSize: `${px}px`, color, padding: { top: 8, bottom: 8 } }).setOrigin(0.5);
    if (kind === 'og') {
      // リンクを貼ったときのカード画像（1200×630）。端は切られることがあるので中央に寄せる
      t(470, 150, 'らくがき勇者', 112).setRotation(-0.03);
      const g = this.add.graphics();
      g.lineStyle(10, 0x2f6fe4, 1);
      g.beginPath(); g.moveTo(200, 222); g.lineTo(380, 216); g.lineTo(560, 224); g.lineTo(740, 218); g.strokePath();
      t(470, 290, 'あなたのリプで、毎日1つ増える', 44);
      [['plane', 'ぶき', 1.7], ['crumb', 'てき', 1.45], ['star', 'できごと', 1.35]].forEach(([key, name, sc], i) => {
        const x = 240 + i * 230, y = 400;
        const box = this.add.graphics();
        box.lineStyle(4, 0x2e3138, 1); box.fillStyle(0xfff6c7, 1);
        box.fillRoundedRect(x - 100, y - 48, 200, 96, 12); box.strokeRoundedRect(x - 100, y - 48, 200, 96, 12);
        doodle(key, x - (name.length > 2 ? 64 : 52), y, sc, i);
        t(x + (name.length > 2 ? 40 : 34), y, name, name.length > 2 ? 28 : 36);
        const badge = this.add.graphics();
        badge.fillStyle(0x2f6fe4, 1); badge.fillCircle(x + 92, y - 44, 24);
        t(x + 92, y - 46, '+1', 28, '#FFFFFF');
      });
      t(470, 520, 'スマホでそのまま遊べる・無料・登録なし', 32, '#5A5F69');
      doodle('hero', 1000, 300, 3.0, 0);
      [[880, 140, 1.4, 0.2], [1110, 500, 1.6, -0.3], [890, 480, 1.2, 0.5]].forEach(([x, y, s, r], i) => doodle('crumb', x, y, s, i % 3, r));
      [[1110, 130], [1130, 260], [860, 320]].forEach(([x, y], i) => doodle('xp', x, y, 1.8, i));
    } else if (kind === 'icon') {
      const g = this.add.graphics();
      g.fillStyle(0x2f6fe4, 0.12); g.fillCircle(400, 420, 300);
      doodle('hero', 400, 415, 6.4, 1);
      [[160, 650], [640, 640], [600, 170]].forEach(([x, y], i) => doodle('xp', x, y, 3.2, i));
    } else {
      // 左下はプロフィール画像に隠れる・上下は約50pxずつ見切れるので、大事なものは中央に寄せる
      t(760, 128, 'らくがき勇者', 108).setRotation(-0.03);
      const g = this.add.graphics();
      g.lineStyle(10, 0x2f6fe4, 1);
      g.beginPath(); g.moveTo(520, 196); g.lineTo(690, 191); g.lineTo(850, 198); g.lineTo(1000, 193); g.strokePath();
      t(760, 262, 'あなたのリプで、毎日1つ増える', 46);
      // 何が増えるかを絵で見せる：ぶき・てき・できごと
      const items = [['plane', 'ぶき', 1.7], ['crumb', 'てき', 1.45], ['star', 'できごと', 1.35]];
      items.forEach(([key, name, sc], i) => {
        const x = 530 + i * 230, y = 372;
        const box = this.add.graphics();
        box.lineStyle(4, 0x2e3138, 1); box.fillStyle(0xfff6c7, 1);
        box.fillRoundedRect(x - 100, y - 48, 200, 96, 12); box.strokeRoundedRect(x - 100, y - 48, 200, 96, 12);
        doodle(key, x - (name.length > 2 ? 64 : 52), y, sc, i);
        t(x + (name.length > 2 ? 40 : 34), y, name, name.length > 2 ? 28 : 36).setOrigin(0.5);
        const badge = this.add.graphics();
        badge.fillStyle(0x2f6fe4, 1); badge.fillCircle(x + 92, y - 44, 24);
        t(x + 92, y - 46, '+1', 28, '#FFFFFF');
      });
      doodle('hero', 1335, 245, 2.6, 0);
      [[1205, 120, 1.4, 0.2], [1450, 395, 1.6, -0.3], [1230, 385, 1.2, 0.5]].forEach(([x, y, s, r], i) => doodle('crumb', x, y, s, i % 3, r));
      [[1440, 110], [1465, 230], [1195, 260]].forEach(([x, y], i) => doodle('xp', x, y, 1.8, i));
    }
    window.__brandReady = true;
  }
}
new Phaser.Game({ type: Phaser.WEBGL, parent: 'out', width: size[0], height: size[1], backgroundColor: '#FDFEFF', scene: [Brand], banner: false, preserveDrawingBuffer: true });
</script></body></html>
